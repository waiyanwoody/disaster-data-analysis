<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Data Analysis and Predictive Mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            50: '#f8fafc',
                            100: '#e2e8f0',
                            200: '#cbd5e1',
                            300: '#94a3b8',
                            400: '#64748b',
                            500: '#475569',
                            600: '#334155',
                            700: '#1e293b',
                            800: '#0f172a',
                            900: '#020617',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/preline@2.0.0/dist/css/preline.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        // Apply saved theme immediately to prevent flash
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-dark-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <!-- Header (Component) -->
    <div id="header"></div>

    <!-- Main Content -->
    <main class="pt-16" id="app"></main>

    <!-- Footer (Component) -->
    <div id="footer"></div>

    <!-- Core Scripts -->
    <script src="js/data.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/api.js"></script>

    <!-- UI Components -->
    <script src="components/ui.js"></script>
    <script src="components/header.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/hero.js"></script>
    <script src="components/stats.js"></script>
    <script src="components/pipeline.js"></script>
    <script src="components/model-cards.js"></script>
    <script src="components/test-form.js"></script>
    <script src="components/result-view.js"></script>
    <script src="components/dataset-info.js"></script>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4" onclick="closeImageModal(event)">
        <div class="relative max-w-7xl w-full">
            <button onclick="closeImageModal()" class="absolute -top-12 right-0 text-white/70 hover:text-white transition-colors">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
            <img id="modalImage" src="" alt="" class="w-full h-auto rounded-2xl shadow-2xl max-h-[85vh] object-contain">
            <div id="modalCaption" class="text-center text-white/80 text-sm mt-4 font-medium"></div>
        </div>
    </div>

    <!-- Main App -->
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline@2.0.0/dist/preline.min.js"></script>
</body>
</html>
